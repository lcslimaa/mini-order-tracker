spring.config.import=optional:file:./.env[.properties]
spring.application.name=mini-order-tracker
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/tracker}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.settings.web-allow-others=false
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
server.error.include-message=never
server.error.include-stacktrace=never
app.jwt.secret=${JWT_SECRET:}
app.jwt.ttl-seconds=${JWT_TTL_SECONDS:3600}
app.operator.name=${OPERATOR_NAME:}
app.operator.email=${OPERATOR_EMAIL:}
app.operator.password=${OPERATOR_PASSWORD:}
